# Configuración para las pruebas automatizadas (U1): base de datos en memoria, sin servicios externos
spring.datasource.url=jdbc:h2:mem:barberia;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.mail.host=localhost
spring.mail.port=2525
app.mail.from=test@laclasica.pe
app.upload.dir=target/test-uploads/comprobantes
app.uploads.root=target/test-uploads
api.dni.token=test
management.endpoints.web.exposure.include=health
management.health.mail.enabled=false

gemini.api-key=
iot.mqtt.enabled=false
iot.http.token=token-de-prueba
iot.alerta.sin-registro-min=0
iot.alerta.sesion-vacia-min=0
