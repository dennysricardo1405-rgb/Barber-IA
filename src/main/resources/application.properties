spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.web.resources.static-locations=classpath:/static/,file:uploads/
spring.devtools.restart.exclude=uploads/**
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Configuración de Servidor de Correo
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_PASS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.socketFactory.port=${MAIL_PORT}
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
app.mail.from=Barbería La Clásica <${MAIL_USER}>
app.upload.dir=uploads/comprobantes
api.dni.token=${API_DNI_TOKEN}

# Usuario administrador inicial (cámbialo con ADMIN_PASSWORD en producción)
app.admin.password=${ADMIN_PASSWORD:admin123}

# ── U1 DevOps: health check usado por el despliegue simulado del pipeline ──
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=false

# ── U2 IA: Google Gemini (sin API key funciona en modo demostración) ──
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
gemini.image-model=${GEMINI_IMAGE_MODEL:gemini-2.5-flash-image}
gemini.preview.enabled=${GEMINI_PREVIEW_ENABLED:true}

# ── U3 IoT: broker MQTT de los sensores de las sillas ──
iot.mqtt.enabled=${MQTT_ENABLED:true}
iot.mqtt.broker-url=${MQTT_BROKER_URL:tcp://localhost:1883}
iot.mqtt.topic-prefix=${MQTT_TOPIC_PREFIX:laclasica}
iot.mqtt.username=${MQTT_USER:}
iot.mqtt.password=${MQTT_PASS:}
iot.http.token=${IOT_HTTP_TOKEN:}
iot.horario.apertura=09:00
iot.alerta.sin-registro-min=${IOT_ALERTA_SIN_REGISTRO_MIN:5}
iot.alerta.sesion-vacia-min=10
iot.alerta.servicio-largo-min=60
iot.alerta.temperatura-max=28
iot.alerta.humedad-max=70
iot.sensor.offline-seg=120
