<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Iniciar Sesión | BarberPro</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style-public.css}">
    <style>
        /* Botón ojo integrado con el estilo oscuro del form */
        .btn-ojo {
            background: #1a1a1a;
            border: 1px solid var(--border);
            border-left: none;
            color: var(--text-muted);
            border-radius: 0 6px 6px 0;
            padding: 0 14px;
            cursor: pointer;
            transition: color 0.2s;
        }
        .btn-ojo:hover { color: var(--gold); }

        /* Quitar el border-radius derecho del input cuando está en grupo */
        .input-group .form-control {
            border-right: none !important;
            border-radius: 6px 0 0 6px !important;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height: 100vh;">

    <div class="auth-card" style="max-width: 420px;">
        <div class="text-center mb-4">
            <h2 style="font-family:'Playfair Display'; color:var(--gold);">
                <i class="fa-solid fa-scissors me-2"></i>Barberia La Clasica
            </h2>
            <p style="color:var(--text-muted); font-size:0.9rem;">Bienvenido de nuevo, estimado cliente</p>
        </div>

        <div th:if="${param.error}" class="alert alert-danger"
             style="background:rgba(231,76,60,0.1); border:1px solid #e74c3c; color:#e74c3c;">
            Correo o contraseña incorrectos.
        </div>

        <form th:action="@{/cliente/login}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="mb-3">
                <label class="form-label small fw-bold">CORREO ELECTRÓNICO</label>
                <input type="email" name="username" class="form-control"
                       placeholder="tu@correo.com" required>
            </div>

            <div class="mb-4">
                <label class="form-label small fw-bold">CONTRASEÑA</label>
                <!-- ← input-group con botón ojo -->
                <div class="input-group">
                    <input type="password" id="loginPassword" name="password"
                           class="form-control" placeholder="••••••••" required>
                    <button type="button" class="btn-ojo" onclick="toggleLoginPassword()"
                            title="Mostrar / ocultar contraseña">
                        <i id="iconoOjoLogin" class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-gold w-100 py-3">
                INGRESAR A MI CUENTA
            </button>
        </form>

        <div class="text-center mt-4">
            <p class="small" style="color:var(--text-muted);">
                ¿Aún no tienes cuenta?
                <a href="/cliente/registro" style="color:var(--gold); text-decoration:none;"
                   class="fw-bold">Regístrate aquí</a>
            </p>
            <a href="/" style="color:var(--gold); text-decoration:none;" class="small">
                <i class="fa-solid fa-arrow-left me-1"></i> Volver al inicio
            </a>
        </div>
    </div>

    <script>
        function toggleLoginPassword() {
            const input = document.getElementById('loginPassword');
            const icono = document.getElementById('iconoOjoLogin');
            if (input.type === 'password') {
                input.type = 'text';
                icono.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = 'password';
                icono.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
