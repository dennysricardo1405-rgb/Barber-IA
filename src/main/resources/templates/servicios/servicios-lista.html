<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Planes y Servicios | BarberPro</title>
    <div th:replace="~{layout/sidebar :: head_comun}"></div>
    <style>
        .precio-badge {
            font-size: 1.1rem; font-weight: 700; color: #ff6b2b;
        }
        .duracion-badge {
            font-size: 0.78rem; padding: 3px 10px; border-radius: 20px;
            background-color: rgba(255,107,43,0.12);
            color: #ff6b2b; font-weight: 600;
        }
        .servicio-img {
            width: 52px; height: 52px; border-radius: 10px;
            object-fit: cover;
            border: 1px solid rgba(255,107,43,0.3);
        }
        .servicio-icon {
            width: 52px; height: 52px; border-radius: 10px;
            background: linear-gradient(135deg, #ff6b2b, #e85a1a);
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 1.1rem; flex-shrink: 0;
        }
        /* Upload preview en modal */
        .img-preview-wrap {
            position: relative; width: 100%; height: 160px;
            border: 2px dashed rgba(255,107,43,0.3);
            border-radius: 10px; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            background: #f8f9fa; cursor: pointer; transition: border-color 0.2s;
        }
        .img-preview-wrap:hover { border-color: #ff6b2b; }
        .img-preview-wrap img {
            width: 100%; height: 100%; object-fit: cover; display: none;
        }
        .img-preview-placeholder {
            display: flex; flex-direction: column; align-items: center;
            gap: 6px; color: #aaa;
        }
        .img-preview-placeholder i { font-size: 1.8rem; color: #ff6b2b; opacity: 0.5; }
        .img-preview-placeholder span { font-size: 0.82rem; }
    </style>
</head>

<body class="bg-light">
<div th:replace="~{layout/sidebar :: sidebar_menu(activePage='servicios')}"></div>

<div class="main-content pt-4">
    <div class="container-fluid">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold mb-0" style="color:#ff6b2b">
                    <i class="fa-solid fa-list-check me-2" style="color:#ff6b2b"></i>
                    Planes y Servicios
                </h2>
                <small class="text-muted">
                    Gestiona los servicios y precios de la barbería
                </small>
            </div>
            <button class="btn btn-primary shadow-sm"
                    data-bs-toggle="modal" data-bs-target="#modalNuevo">
                <i class="fa-solid fa-plus me-2"></i>Nuevo Servicio
            </button>
        </div>
            </button>
        </div>

        <!-- Alertas -->
        <div th:if="${exito}" class="alert alert-success alert-dismissible fade show">
            <i class="fa-solid fa-circle-check me-2"></i>
            <span th:text="${exito}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
            <i class="fa-solid fa-circle-xmark me-2"></i>
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Tabla -->
        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light text-uppercase small">
                            <tr>
                                <th class="ps-4">Imagen</th>
                                <th>Servicio</th>
                                <th>Descripción</th>
                                <th>Precio</th>
                                <th>Duración</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="s : ${servicios}">
                                <td class="ps-4">
                                    <img th:if="${s.imagenUrl != null and !s.imagenUrl.isEmpty()}"
                                         th:src="${s.imagenUrl}"
                                         class="servicio-img" th:alt="${s.nombre}">
                                    <div th:if="${s.imagenUrl == null or s.imagenUrl.isEmpty()}"
                                         class="servicio-icon">
                                        <i class="fa-solid fa-scissors"></i>
                                    </div>
                                </td>
                                <td>
                                    <div class="fw-bold" th:text="${s.nombre}"></div>
                                </td>
                                <td class="text-muted"
                                    th:text="${s.descripcion ?: '—'}"></td>
                                <td>
                                    <span class="precio-badge"
                                          th:text="'S/ ' + ${s.precio}"></span>
                                </td>
                                <td>
                                    <span class="duracion-badge"
                                          th:text="${s.duracionMinutos} + ' min'"></span>
                                </td>
                                <td>
                                    <label class="switch mb-0">
                                        <input type="checkbox"
                                               th:checked="${s.estado == 1}"
                                               th:onchange="'window.location.href=\'/admin/servicios/estado/' + ${s.id} + '\''">
                                        <span class="slider"></span>
                                    </label>
                                </td>
                                <td>
                                    <button class="btn btn-sm btn-outline-warning rounded-circle"
                                            th:data-id="${s.id}"
                                            th:data-nombre="${s.nombre}"
                                            th:data-descripcion="${s.descripcion}"
                                            th:data-precio="${s.precio}"
                                            th:data-duracion="${s.duracionMinutos}"
                                            th:data-imagen="${s.imagenUrl}"
                                            onclick="editarServicio(this)"
                                            title="Editar">
                                        <i class="fa-solid fa-pen"></i>
                                    </button>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(servicios)}">
                                <td colspan="7" class="text-center text-muted py-5">
                                    <i class="fa-solid fa-list-check fa-2x mb-3 d-block"
                                       style="color:#ff6b2b;opacity:0.3"></i>
                                    No hay servicios registrados
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- MODAL NUEVO -->
<div class="modal fade" id="modalNuevo" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title fw-bold">
                    <i class="fa-solid fa-plus me-2"></i>Nuevo Servicio
                </h5>
                <button type="button" class="btn-close btn-close-white"
                        data-bs-dismiss="modal"></button>
            </div>
            <form th:action="@{/admin/servicios/guardar}" method="post"
                  enctype="multipart/form-data">
                <input type="hidden" th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}"/>
                <div class="modal-body p-4">

                    <!-- Upload imagen -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold">
                            Imagen del servicio
                        </label>
                        <div class="img-preview-wrap"
                             onclick="document.getElementById('newImgFile').click()">
                            <img id="newImgPreview" src="" alt="Preview">
                            <div class="img-preview-placeholder" id="newImgPlaceholder">
                                <i class="fa-solid fa-cloud-arrow-up"></i>
                                <span>Clic para subir imagen</span>
                                <span style="font-size:0.75rem;color:#bbb;">
                                    JPG, PNG — máx. 5MB
                                </span>
                            </div>
                        </div>
                        <input type="file" id="newImgFile" name="imagenFile"
                               accept="image/*" class="d-none"
                               onchange="previewImagen(this, 'newImgPreview', 'newImgPlaceholder')">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Nombre del servicio</label>
                        <input type="text" name="nombre" class="form-control"
                               placeholder="Ej: Corte + Barba" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Descripción</label>
                        <textarea name="descripcion" class="form-control" rows="2"
                                  placeholder="Descripción del servicio..."></textarea>
                    </div>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Precio (S/)</label>
                            <input type="number" name="precio" class="form-control"
                                   step="0.50" min="0" placeholder="0.00" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Duración (minutos)</label>
                            <input type="number" name="duracionMinutos"
                                   class="form-control"
                                   min="15" step="15" value="30" required>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary"
                            data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary px-4">
                        Guardar
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- MODAL EDITAR -->
<div class="modal fade" id="modalEditar" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header bg-warning">
                <h5 class="modal-title fw-bold">
                    <i class="fa-solid fa-pen me-2"></i>Editar Servicio
                </h5>
                <button type="button" class="btn-close"
                        data-bs-dismiss="modal"></button>
            </div>
            <form th:action="@{/admin/servicios/editar}" method="post"
                  enctype="multipart/form-data">
                <input type="hidden" th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}"/>
                <input type="hidden" name="id" id="editId">
                <div class="modal-body p-4">

                    <!-- Upload imagen -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold">
                            Imagen del servicio
                        </label>
                        <div class="img-preview-wrap"
                             onclick="document.getElementById('editImgFile').click()">
                            <img id="editImgPreview" src="" alt="Preview"
                                 style="display:none;">
                            <div class="img-preview-placeholder"
                                 id="editImgPlaceholder">
                                <i class="fa-solid fa-cloud-arrow-up"></i>
                                <span>Clic para cambiar imagen</span>
                                <span style="font-size:0.75rem;color:#bbb;">
                                    JPG, PNG — máx. 5MB
                                </span>
                            </div>
                        </div>
                        <input type="file" id="editImgFile" name="imagenFile"
                               accept="image/*" class="d-none"
                               onchange="previewImagen(this, 'editImgPreview', 'editImgPlaceholder')">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Nombre del servicio</label>
                        <input type="text" name="nombre" id="editNombre"
                               class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Descripción</label>
                        <textarea name="descripcion" id="editDescripcion"
                                  class="form-control" rows="2"></textarea>
                    </div>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Precio (S/)</label>
                            <input type="number" name="precio" id="editPrecio"
                                   class="form-control" step="0.50" min="0" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Duración (minutos)</label>
                            <input type="number" name="duracionMinutos"
                                   id="editDuracion" class="form-control"
                                   min="15" step="15" required>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary"
                            data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-warning px-4 fw-bold">
                        Guardar Cambios
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
function previewImagen(input, previewId, placeholderId) {
    const file = input.files[0];
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) {
        alert('La imagen no debe superar 5MB'); return;
    }
    const img         = document.getElementById(previewId);
    const placeholder = document.getElementById(placeholderId);
    img.src           = URL.createObjectURL(file);
    img.style.display = 'block';
    placeholder.style.display = 'none';
}

function editarServicio(btn) {
    document.getElementById('editId').value          = btn.dataset.id;
    document.getElementById('editNombre').value      = btn.dataset.nombre;
    document.getElementById('editDescripcion').value = btn.dataset.descripcion || '';
    document.getElementById('editPrecio').value      = btn.dataset.precio;
    document.getElementById('editDuracion').value    = btn.dataset.duracion;

    // Mostrar imagen actual si existe
    const img         = document.getElementById('editImgPreview');
    const placeholder = document.getElementById('editImgPlaceholder');
    if (btn.dataset.imagen && btn.dataset.imagen !== 'null') {
        img.src           = btn.dataset.imagen;
        img.style.display = 'block';
        placeholder.style.display = 'none';
    } else {
        img.style.display = 'none';
        placeholder.style.display = 'flex';
    }

    bootstrap.Modal.getOrCreateInstance(
        document.getElementById('modalEditar')).show();
}
</script>
</body>
</html>
