<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Mi Panel | BarberPro</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #c9a84c; --gold-light: #e8c97a;
            --bg: #0a0a0a; --bg-card: #111111;
            --text: #f0ece0; --text-muted: rgba(240,236,224,0.5);
            --border: rgba(201,168,76,0.2);
        }
        body { background-color: var(--bg); color: var(--text); font-family: 'Barlow', sans-serif; min-height: 100vh; }
        .navbar-custom { background-color: rgba(10,10,10,0.95); border-bottom: 1px solid var(--border); padding: 16px 0; }
        .navbar-brand-text { font-family: 'Playfair Display', serif; font-size: 1.4rem; color: var(--gold) !important; text-decoration: none; }
        .main { padding: 80px 0 40px; }
        .welcome-card {
            background: linear-gradient(135deg, #1a1a1a, #111);
            border: 1px solid var(--border);
            border-radius: 16px; padding: 32px;
            margin-bottom: 28px;
        }
        .welcome-card h2 { font-family: 'Playfair Display', serif; color: var(--gold); }
        .action-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 14px; padding: 28px;
            text-align: center; transition: all 0.3s;
            text-decoration: none; color: var(--text);
            display: block;
        }
        .action-card:hover { transform: translateY(-4px); border-color: var(--gold); color: var(--text); box-shadow: 0 12px 40px rgba(201,168,76,0.1); }
        .action-icon { width: 60px; height: 60px; border-radius: 14px; background: rgba(201,168,76,0.12); display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; font-size: 1.5rem; color: var(--gold); }
        .btn-gold { background: linear-gradient(135deg, var(--gold), #9a7a30); color: #0a0a0a; font-weight: 700; border: none; padding: 10px 24px; border-radius: 8px; transition: all 0.3s; text-decoration: none; }
        .btn-gold:hover { background: linear-gradient(135deg, var(--gold-light), var(--gold)); color: #0a0a0a; }
        .btn-outline-gold { background: transparent; color: var(--gold); border: 1px solid var(--gold); padding: 10px 24px; border-radius: 8px; font-weight: 600; text-decoration: none; transition: all 0.3s; }
        .btn-outline-gold:hover { background: var(--gold); color: #0a0a0a; }
        .dropdown-menu { background:#111 !important; border: 1px solid var(--border) !important; }
        .dropdown-item { color: var(--text) !important; }
        .dropdown-item:hover { background: rgba(201,168,76,0.1) !important; }
    </style>
</head>
<body>
 
    <!-- Navbar -->
    <nav class="navbar-custom">
        <div class="container d-flex justify-content-between align-items-center">
            <a href="/" class="navbar-brand-text">
                <i class="fa-solid fa-scissors me-2"></i>BarberPro
            </a>
            <div class="dropdown">
                <button class="btn-outline-gold dropdown-toggle d-flex align-items-center gap-2"
                        type="button" data-bs-toggle="dropdown">
                    <i class="fa-solid fa-circle-user fa-lg"></i>
                    <span sec:authentication="name">Mi cuenta</span>
                </button>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li>
                        <a class="dropdown-item" href="/cliente/citas">
                            <i class="fa-solid fa-calendar-check me-2" style="color:#c9a84c"></i>Mis Citas
                        </a>
                    </li>
                    <li><hr class="dropdown-divider" style="border-color:rgba(201,168,76,0.2)"></li>
                    <li>
                        <form th:action="@{/logout}" method="post" class="px-3">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="dropdown-item p-0"
                                    style="color:#e74c3c;background:none;border:none;">
                                <i class="fa-solid fa-right-from-bracket me-2"></i>Cerrar Sesión
                            </button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
 
    <div class="main">
        <div class="container">
 
            <!-- Bienvenida -->
            <div class="welcome-card">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h2 class="mb-1">¡Bienvenido!</h2>
                        <p style="color:var(--text-muted)" sec:authentication="name">cliente@email.com</p>
                    </div>
                    <i class="fa-solid fa-circle-user fa-3x" style="color:var(--gold); opacity:0.5"></i>
                </div>
            </div>
 
            <!-- Acciones -->
            <div class="row g-4">
                <div class="col-md-4">
                    <a href="/cliente/reservar" class="action-card">
                        <div class="action-icon">
                            <i class="fa-solid fa-calendar-plus"></i>
                        </div>
                        <h5>Reservar Cita</h5>
                        <p style="color:var(--text-muted); font-size:0.9rem;">
                            Elige tu barbero, servicio y horario
                        </p>
                    </a>
                </div>
                <div class="col-md-4">
                    <a href="/cliente/citas" class="action-card">
                        <div class="action-icon">
                            <i class="fa-solid fa-calendar-check"></i>
                        </div>
                        <h5>Mis Citas</h5>
                        <p style="color:var(--text-muted); font-size:0.9rem;">
                            Ver y gestionar tus citas
                        </p>
                    </a>
                </div>
                <div class="col-md-4">
                    <a href="/#productos" class="action-card">
                        <div class="action-icon">
                            <i class="fa-solid fa-bag-shopping"></i>
                        </div>
                        <h5>Catálogo</h5>
                        <p style="color:var(--text-muted); font-size:0.9rem;">
                            Ver productos disponibles
                        </p>
                    </a>
                </div>
            </div>
 
        </div>
    </div>
 
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
