services:
  mysql:
    image: mysql:8.0
    container_name: barberia-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # U3 - Capa de transmisión: broker MQTT al que publican los sensores de las sillas
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: barberia-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./iot/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data

  app:
    # En CI/CD se usa la imagen publicada en Docker Hub (APP_IMAGE); en local se construye
    image: ${APP_IMAGE:-barber-ia-app:local}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: barberia-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      mosquitto:
        condition: service_started
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: ${MYSQL_USER}
      DB_PASS: ${MYSQL_PASSWORD}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USER: ${MAIL_USER}
      MAIL_PASS: ${MAIL_PASS}
      API_DNI_TOKEN: ${API_DNI_TOKEN}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      DEMO_DATA: ${DEMO_DATA:-false}
      TZ: America/Lima
      # U2 - IA
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      GEMINI_IMAGE_MODEL: ${GEMINI_IMAGE_MODEL:-gemini-3.1-flash-lite-image}
      GEMINI_FALLBACK_MODEL: ${GEMINI_FALLBACK_MODEL:-gemini-3.5-flash-lite}
      # U3 - IoT
      MQTT_BROKER_URL: ${MQTT_BROKER_URL:-tcp://mosquitto:1883}
      MQTT_TOPIC_PREFIX: ${MQTT_TOPIC_PREFIX:-laclasica}
      IOT_HTTP_TOKEN: ${IOT_HTTP_TOKEN:-}
      # U4 - Agente de citas (n8n)
      BOT_API_KEY: ${BOT_API_KEY:-}
    ports:
      - "8080:8080"
    volumes:
      - uploads_data:/app/uploads

  # U3 - Capa de percepción simulada: un sensor de presencia por silla + sensor de ambiente
  iot-simulador:
    build:
      context: ./iot/simulador
    container_name: barberia-iot-simulador
    restart: unless-stopped
    depends_on:
      - mosquitto
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MQTT_TOPIC_PREFIX: ${MQTT_TOPIC_PREFIX:-laclasica}
      SILLAS: ${IOT_SILLAS:-1,2,3,4}
      ESCALA_TIEMPO: ${IOT_ESCALA_TIEMPO:-10}
    profiles: ["iot"]

  # U2 - Laboratorio de prompts (Streamlit)
  streamlit:
    build:
      context: .
      dockerfile: ia/streamlit/Dockerfile
    container_name: barberia-streamlit
    depends_on:
      - app
    environment:
      BARBERIA_API_URL: http://app:8080
    ports:
      - "8501:8501"
    profiles: ["ia"]

  # U4 - Automatización: agente de citas por Telegram (n8n + Gemini)
  n8n:
    image: n8nio/n8n:2.44.4
    container_name: barberia-n8n
    restart: unless-stopped
    depends_on:
      - app
      - tunel
    entrypoint: ["tini", "--", "/bin/sh", "/opt/barberia/iniciar.sh"]
    environment:
      TZ: America/Lima
      GENERIC_TIMEZONE: America/Lima
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-}
      N8N_PUBLIC_URL: ${N8N_PUBLIC_URL:-}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      BARBERIA_API_URL: http://app:8080
      BOT_API_KEY: ${BOT_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # El bot usa primero el modelo lite: responde rápido y casi nunca da 503 por alta demanda
      GEMINI_MODEL: ${BOT_GEMINI_MODEL:-gemini-3.5-flash-lite}
      GEMINI_FALLBACK_MODEL: ${BOT_GEMINI_FALLBACK_MODEL:-gemini-3.8-flash}
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/iniciar.sh:/opt/barberia/iniciar.sh:ro
      - ./n8n/credenciales.js:/opt/barberia/credenciales.js:ro
      - ./n8n/workflows:/opt/barberia/workflows:ro
    profiles: ["bot"]

  # U4 - Túnel HTTPS gratuito para que Telegram llegue al webhook de n8n (no necesita cuenta)
  tunel:
    image: cloudflare/cloudflared:2026.10.1
    container_name: barberia-tunel
    restart: unless-stopped
    command: ["tunnel", "--metrics", "0.0.0.0:2000", "--url", "http://n8n:5678"]
    profiles: ["bot"]

volumes:
  mysql_data:
  mosquitto_data:
  uploads_data:
  n8n_data:
