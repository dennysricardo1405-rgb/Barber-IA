name: CI/CD Barbería La Clásica

# U1 - Pipeline: build + pruebas -> imagen Docker -> despliegue simulado con smoke tests
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Build y pruebas automatizadas ─────────────────────────────────────────
  test:
    name: Build y pruebas (Maven)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compilar, ejecutar pruebas y medir cobertura
        run: mvn -B verify

      - name: Resumen de pruebas y cobertura
        if: always()
        run: |
          {
            echo "## Pruebas automatizadas"
            for f in target/surefire-reports/TEST-*.xml; do
              n=$(basename "$f" .xml | sed 's/TEST-com.example.BarberiaLaClasica.//')
              t=$(grep -o 'tests="[0-9]*"' "$f" | head -1 | grep -o '[0-9]*')
              fl=$(grep -o 'failures="[0-9]*"' "$f" | head -1 | grep -o '[0-9]*')
              e=$(grep -o 'errors="[0-9]*"' "$f" | head -1 | grep -o '[0-9]*')
              echo "- \`$n\`: $t pruebas, $fl fallos, $e errores"
            done
            if [ -f target/site/jacoco/jacoco.csv ]; then
              awk -F, 'NR>1 {m+=$8; c+=$9} END {printf "\n**Cobertura de líneas:** %.1f%%\n", (c*100)/(m+c)}' target/site/jacoco/jacoco.csv
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-pruebas
          path: |
            target/surefire-reports/
            target/site/jacoco/

  # ── 2. Verificación de los componentes Python (simulador IoT y Streamlit) ─────
  python:
    name: Verificar simulador IoT y app Streamlit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install -r iot/simulador/requirements.txt -r ia/streamlit/requirements.txt
      - name: Compilar scripts
        run: python -m py_compile iot/simulador/simulador.py ia/streamlit/app.py

  # ── 3. Imagen Docker (se publica en Docker Hub solo desde main) ──────────────
  docker:
    name: Imagen Docker
    needs: [ test, python ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build y push de la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/barber-ia:latest
            ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/barber-ia:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 4. Despliegue simulado: levanta todo el stack y prueba que responda ───────
  deploy-simulado:
    name: Despliegue simulado (docker compose)
    needs: docker
    runs-on: ubuntu-latest
    env:
      IOT_HTTP_TOKEN: ci-token
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Preparar variables de entorno
        run: |
          cp .env.example .env
          sed -i 's/^IOT_HTTP_TOKEN=.*/IOT_HTTP_TOKEN=ci-token/' .env
          echo "IOT_ESCALA_TIEMPO=600" >> .env
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "APP_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/barber-ia:${{ github.sha }}" >> .env
          fi

      - name: Obtener la imagen de la aplicación
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            docker compose pull app
          else
            docker compose build app
          fi

      - name: Levantar MySQL, Mosquitto, app y simulador IoT
        run: docker compose --profile iot up -d

      - name: Esperar health check de la aplicación
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health | grep -q '"UP"'; then
              echo "Aplicación saludable"; exit 0
            fi
            sleep 5
          done
          echo "La aplicación no respondió a tiempo"; exit 1

      - name: Smoke tests
        run: |
          set -e
          echo "Página principal";      curl -fsS -o /dev/null http://localhost:8080/
          echo "Login";                 curl -fsS -o /dev/null http://localhost:8080/cliente/login
          echo "U2 asesor IA (página)"; curl -fsS -o /dev/null http://localhost:8080/asesor-ia
          echo "U2 asesor IA (API, modo demo)"
          printf '\xff\xd8\xff\xe0demo' > selfie.jpg
          curl -fsS -F "foto=@selfie.jpg;type=image/jpeg" -F estrategia=FEW_SHOT \
            http://localhost:8080/api/ia/asesor | tee /dev/stderr | grep -q '"corteRecomendado"'
          echo "U3 nodo IoT por HTTP"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
            -H 'X-IOT-TOKEN: ci-token' -d '{"temperatura":24.5,"humedad":60}' \
            http://localhost:8080/api/iot/ambiente)" = "201"
          echo "U3 dashboard protegido"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/monitoreo)" = "302"

      - name: Verificar flujo IoT de punta a punta (simulador -> MQTT -> app -> MySQL)
        run: |
          source .env
          for i in $(seq 1 24); do
            n=$(docker compose exec -T mysql mysql -N -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" "$MYSQL_DATABASE" \
                -e "SELECT COUNT(*) FROM lecturas_iot WHERE canal='MQTT'" 2>/dev/null || echo 0)
            echo "Lecturas MQTT guardadas: $n"
            if [ "${n:-0}" -gt 0 ]; then exit 0; fi
            sleep 5
          done
          exit 1

      - name: Logs ante fallo
        if: failure()
        run: docker compose --profile iot logs --tail=200

      - name: Apagar el entorno
        if: always()
        run: docker compose --profile iot down -v
